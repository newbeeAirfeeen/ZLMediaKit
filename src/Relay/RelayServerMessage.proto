syntax = "proto2";
message RelayMessage {
    enum MessageType { REQUEST = 1; RESPONE = 2; START = 3; MEDIAPACKAGE = 4; PING = 5; PONG = 6; SERVERCMD = 7; RTMPCMD = 8; CLIENTCMD = 9; IPCAMCMD = 10;}
    required MessageType message_type = 1;
    optional Request request = 2;
    optional Response response = 3;
    optional Start start = 4;
    optional MediaPackage media_package = 5;
    optional Ping ping = 6;
    optional Pong pong = 7;
    optional ServerCmd server_cmd = 8;
    optional RtmpCmd rtmp_cmd = 9;
    optional ClientCmd client_cmd = 10;
    optional IpcamCmd ipcam_cmd = 11;
}

message Request {
    required string user_name = 1; // oauth user name
    required string password = 2; // oauth user  password
    required string device_name = 3; // oauth device name
    required string device_id = 4; // oauth device id
    required string file_name = 5; //upload file name, utf8 encoded
    required string key = 6; // server service key 12bit, test key =12345678qwer
    required uint32 type = 7; // request type, 1:upload, 2:package download 3:stream download 4:zippo-002 6:client websocket
    optional bool use_zlib = 8;// reused to identify client type. false: web client true: ios/android client
    required string version = 9;// not used now
    optional uint32 session_id = 10; // be used for file transfer resume
    required string channel_name = 11;// example: "720p", "qvga"
    optional string ipcam_id = 12;// if type is download, this must be set
    optional string cloud_token = 13; // cloud token
    optional bool is_record = 14 [default = true];
    optional string unified_id = 15;// oauth unified id
    optional uint32 head_len = 16; // data package head length, 2 or 4 bytes.
    optional string share_id = 17; // share id
    optional uint32 video_width = 18;
    optional uint32 video_height = 19;
    optional string product_key = 20;
    optional string product_secret = 21;
    optional bool is_manage_event = 22;
    optional uint32 sub_type = 23; //0:normal, other:reboot reason
    optional uint32 channel_type = 24;// 0:undefined, 1:4s I-Frame
    optional string room_id = 25;
    optional bool is_check_network = 26;
    optional uint32 channel_no = 27;
    optional string flow_info = 28;
    optional string sub_device_id = 29;
    optional uint32 video_encode = 30; //1:h264, 2:h265, default is h264
    optional uint32 stream_id = 31; // 双目通道号
}

message Response {
    required uint32 result = 1; // 0:success
    optional string server_time = 2; // server utc time
    required uint32 session_id = 3; // be used for file transfer resume
    optional uint32 oauth_error_code = 4;
    required string cloud_token = 5;
    required uint32 cloud_did = 6;
    optional uint32 upload_head_len = 7; // upload client data package head length
    optional uint32 event_combine_span = 8;
    optional uint32 device_status = 9;    // status=0:�����ײ�; status=1:�����ײ�; status=2:�������
    optional string room_id = 10;
    optional bool is_check_network = 11;
    optional uint32 setting_status = 12; // 0:not update, 1:need update to config center
    optional uint32 udp_port = 13;
	optional uint32 loud_sound_threshold = 14;
	optional uint32 i_frame_span = 15;
	optional uint32 ping_pong_count = 16;
    optional uint32 ip_adders_span = 17; // hour
    optional uint32 assign_ip_span = 18; // second
	optional uint32 qos_span = 19; // 0:close, N:open and interval is Ns
	optional uint32 log_level = 20; // close--0��error--1��warn--2��info--3
	optional string camera_setting = 21;
}

message Start {
    required string comment_string = 1; // client pass this string to the peer who download the file
}

message MediaPackage {
    required uint32 package_type = 1;// 0:undefined, 1:audio, 2:video, 3:audio_config, 4:video_config, 5:live_thumbnail, 6:first schedule thumbnail, 7:second schedule thumbnail, 8:first motion event thumbnail, 9:second motion event thumbnail, 10:first sound event thumbnail, 11:second sound event thumbnail, 16:face register jpg data, 17:embeded info
    required uint32 control_flag = 2;// 0:undefined, 1:in process, 2:record start, 3:record end, 4:schedule start 5:schedule end, 6:motion event start, 7:motion event end, 8:sound event start, 9:sound event end, 10:someone event start, 11:someone event end, 12:timeline record end, 20:shutter event start, 21:shutter event end, 22:tamper event start, 23:tamper event end, 24:PIR start, 25:PIR end
    required uint32 sync = 3 [default = 0];
    required uint32 time_span = 4;
    required uint32 data_size = 5;
    required uint32 start_time = 6;
    required uint32 seq_num = 7;
    required bytes data = 8;
    optional string device_id = 9;// source device id;
    optional uint64 ipcam_time = 10;
    optional uint32 frame_type = 11; // 0: unknown, 1:I, 2:P, 3: B
}

message Ping {
    required uint32 id = 1 [default = 0];
}

message Pong {
    required uint32 id = 1 [default = 0];
}

message ServerCmd {
    required uint32 count = 1; // download clients count
    optional uint32 type = 2; // 0:undefined, 1:start, 2:result, 3:end, 4:error, 5:buffer start, 6:buffer end, 7:device status, 8:download network bad, 9:upload network bad, 10:relay_msg, 12:Face Recognize Response
    // 13:client check network msg, 14:ipcam check network msg, 15:server UTC time, 16: multi-play device id list mapping, 17: message to split multi-play data and p2p play data, 18: room id
	// 20: notify camera to clear cache relay ip, 35:camera qos span and log level in json
    optional string device_id = 3;// ��ʶ��ԴdeviceId���磺 esd_server_cmd;
    optional uint32 error_code = 4;
    optional uint32 device_status = 5; // status=0:�����ײ�; status=1:�����ײ�; status=2:�������
    optional string relay_msg = 6;
    optional uint64 server_time=7;
    optional uint32 extra_param =8;
    optional uint32 time_span = 9;
    optional uint32 cmd_id = 10;
    optional bytes data = 11;
    optional uint32 data_size = 12;
    optional string evt_data_from = 13;
    optional uint32 i_frame_span = 14;
	optional uint32 channel_no = 15;
}

message RtmpCmd {
    required uint32 value = 1; // 0:can't play 1:play
    required uint32 type = 2; // 0:undefined, 1:start, 2:result, 3:end
}

message ClientCmd {
    required uint32 type = 1; // 0:undefined, 1:start play, 2:stop play, 3:get live thumbnail, 4:client msg, 5:Start face jpg file, 6:End face jpg file, 7:Start face merge, 8:End face merge, 9: Cancel face merge, 10:Prepare face merge, 11: save register video
    // 13:check network msg,  20:get person info, 21: get room ID,  22: release room ID
    optional string device_id = 2;// client device id;
    optional uint32 width = 3; // live thumbnail width
    optional uint32 height = 4; // deprecated, live thumbnail height
    optional string client_msg = 5;
    optional string room_id = 6;
    optional uint32 cmd_id = 10;
    optional bytes data = 11;
    optional uint32 data_size = 12;
	optional uint32 channel_no = 15;
}

message IpcamCmd {
    required uint32 type = 1; // 0:undefined, 1:device status change, 2:upload network bad, 3:ipcam message, 4:Start Face Recognize, 5:��ǰ��Ƶ���ķֱ���, 6:get server UTC time, 14:check network msg, 35:camera_log (work log and qos log, etc)
    optional string ipcam_msg = 2;
    optional string device_id = 3; // ��type==3���д˲���Ϊ���͸�ָ����Client������Ϊ�����������ߵ�Client����ͬһ�û�����
    optional bool add_download_queue = 4;  // true�� ��ת������Ϣ����ͻ��˵����������Ͷ���;  false, �������� �� δ��������͡�
    optional uint32 video_width = 5;
    optional uint32 video_height = 6;
    optional string ipcam_id = 7;
    optional uint32 extra_param = 8;	//useful when type=6
    optional uint32 cmd_id = 10;
    optional bytes data = 11;
    optional uint32 data_size = 12;
	optional uint32 channel_no = 15;
}

option optimize_for = LITE_RUNTIME;
